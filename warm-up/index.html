<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warm-up · Allmaps at Yale Library</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f4f4f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; }
  #deck { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #hud { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
         background: rgba(255,255,255,.96); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 18px 22px; z-index: 10; }
  #hud h1 { font-size: 17px; margin: 0 0 6px; }
  #hud p { margin: 4px 0; font-size: 14px; color: #444; }
  #bar { height: 8px; background: #e2e2e0; border-radius: 4px; overflow: hidden; margin: 12px 0 8px; }
  #fill { height: 100%; width: 0; background: #00356b; transition: width .4s; }
  button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 10px; border: 0; background: #00356b; color: #fff; cursor: pointer; }
  button[disabled] { background: #9aa6b8; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .muted { color: #777; font-size: 13px; }
</style>
</head>
<body>
<iframe id="deck" title="Allmaps at Yale Library" src="../"></iframe>
<div id="hud">
  <h1>Warming up the deck</h1>
  <p id="status">Loading the slides…</p>
  <div id="bar"><div id="fill"></div></div>
  <p class="muted" id="detail"></p>
  <div class="row">
    <button id="go" disabled>Start the presentation</button>
    <span class="muted" id="hint">Every slide is visited in turn so the browser caches its maps. About 5 minutes. Keep this tab in front and do not close it.</span>
  </div>
</div>
<script>
  // Slide slugs in deck order (the hash the deck uses for each slide). Slide 1 has no hash.
  const slides = [
    "", "a-picture-of-a-map", "step-1-draw-the-mask", "step-2-points-on-the-scan",
    "step-2-points-on-the-modern-map", "step-3-put-the-map-in-place", "step-4-published",
    "new-haven-1817", "new-haven-1817-transparent", "new-haven-1847", "new-haven-1847-see-through",
    "new-haven-1883", "new-haven-1883-see-through", "new-haven-1893", "new-haven-1893-one-colour",
    "new-haven-1911", "new-haven-1911-see-through", "new-haven-1922", "new-haven-1922-see-through",
    "new-england-1774", "find-new-haven", "new-york-1776", "new-york-1776-see-through",
    "portolan-polynomial", "portolan-spline", "where-the-chart-stretches", "planisphere-1780",
    "ready-to-use", "why-yale-invested", "try-it"
  ];
  // Dwell per slide in seconds; the first Doolittle slides fetch the most tiles, so they get longer.
  const params = new URLSearchParams(location.search);
  const base = Number(params.get("dwell")) || 9;
  const dwell = (i) => (i >= 1 && i <= 8 ? base + 6 : base);

  const deck = document.getElementById("deck");
  const status = document.getElementById("status");
  const detail = document.getElementById("detail");
  const fill = document.getElementById("fill");
  const go = document.getElementById("go");
  const hint = document.getElementById("hint");
  const sleep = (s) => new Promise((r) => setTimeout(r, s * 1000));
  const started = Date.now();

  async function run() {
    await new Promise((r) => (deck.complete ? r() : deck.addEventListener("load", r, { once: true })));
    await sleep(4);
    // Click through the start screen if it is showing.
    try {
      const btn = [...deck.contentDocument.querySelectorAll("button")].find((b) => /start/i.test(b.textContent));
      if (btn) btn.click();
    } catch (e) {}
    for (let i = 0; i < slides.length; i++) {
      try { deck.contentWindow.location.hash = slides[i] ? "#" + slides[i] : ""; } catch (e) {}
      status.textContent = `Slide ${i + 1} of ${slides.length}: ${slides[i] || "every-map"}`;
      fill.style.width = `${Math.round(((i + 1) / slides.length) * 100)}%`;
      detail.textContent = `${Math.round((Date.now() - started) / 1000)} s elapsed`;
      await sleep(dwell(i));
    }
    try { deck.contentWindow.location.hash = ""; } catch (e) {}
    status.textContent = "Ready. Every map in the deck has been fetched once.";
    detail.textContent = `Done in ${Math.round((Date.now() - started) / 1000)} s. Yale's image server caches tiles for 15 minutes, so start within that time, or run this again.`;
    hint.textContent = "";
    go.disabled = false;
    go.focus();
  }
  // Present from the warmed-up frame itself: nothing is reloaded, so the in-memory map cache survives too.
  go.addEventListener("click", () => {
    document.getElementById("hud").remove();
    try { deck.contentWindow.location.hash = ""; deck.contentWindow.focus(); } catch (e) {}
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  deck.addEventListener("load", () => { try { deck.contentWindow.focus(); } catch (e) {} });
  run();
</script>
</body>
</html>
